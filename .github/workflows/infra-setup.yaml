name: AWS Infrastructure Provisioning

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'setup/terraform/**'

env:
  AWS_REGION: us-east-1

jobs:
  terraform:
    name: Terraform Apply EKS Infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Debug AWS credentials
        run: |
          echo "--- AWS ENV VARS ---"
          env | grep '^AWS_' || true
          echo "--- STS get-caller-identity ---"
          aws sts get-caller-identity || true

      - name: Terraform Init & Apply
        run: |
          cd setup/terraform
          rm -f .terraform.lock.hcl
          terraform init -upgrade
          terraform apply -auto-approve

      - name: Update Kubeconfig and Configure Cluster Access
        run: |
          aws eks update-kubeconfig --name cluster --region ${{ env.AWS_REGION }}
          kubectl get nodes || true
          kubectl get svc || true

